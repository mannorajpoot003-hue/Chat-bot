{% extends 'base.html' %}
{% block content %}

<div style="
  min-height:100vh;
  background: linear-gradient(135deg, #1E1B2E 0%, #2D2060 50%, #1A1A2E 100%);
  display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="
    background:#fff; border-radius:20px; padding:40px;
    width:100%; max-width:480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);">

    <h2 style="font-size:1.3rem; font-weight:700; color:#1A1A2E; margin-bottom:6px;">
      <i class="fa fa-user-plus" style="color:#6C47FF; margin-right:8px;"></i>
      Add Member
    </h2>
    <p style="font-size:0.83rem; color:#9490B0; margin-bottom:24px;">
      Adding to <strong style="color:#6C47FF;">{{ room.name }}</strong>
    </p>

    <form method="POST">
      {% csrf_token %}
      <label style="display:block; font-size:0.82rem; font-weight:600; color:#4B4870; margin-bottom:8px;">
        Select a user to add:
      </label>
      <select name="user_id" id="user_select" style="
        width:100%; padding:12px 16px;
        border:1.5px solid #E5E2F5; border-radius:8px;
        font-size:0.9rem; font-family:'Inter',sans-serif;
        color:#1A1A2E; background:#F8F7FF;
        outline:none; margin-bottom:20px;">
        {% for user in all_users %}
          <option value="{{ user.id }}">{{ user.username }}</option>
        {% empty %}
          <option disabled>No users available</option>
        {% endfor %}
      </select>

      <button type="submit" style="
        width:100%; padding:12px;
        background:linear-gradient(135deg,#6C47FF,#9B72FF);
        color:#fff; border:none; border-radius:8px;
        font-size:0.9rem; font-weight:700; font-family:'Inter',sans-serif;
        cursor:pointer; box-shadow:0 6px 20px rgba(108,71,255,0.35);">
        <i class="fa fa-plus" style="margin-right:6px;"></i> Add to Group
      </button>
    </form>

    <div style="text-align:center; margin-top:18px;">
      <a href="{% url 'manage_members' room.id %}" style="font-size:0.82rem; color:#9490B0; text-decoration:none; margin-right:14px;">
        <i class="fa fa-users-cog" style="margin-right:4px;"></i> Manage Members
      </a>
      <a href="{% url 'room_chat' room.id %}" style="font-size:0.82rem; color:#6C47FF; text-decoration:none;">
        <i class="fa fa-arrow-left" style="margin-right:4px;"></i> Back to Chat
      </a>
    </div>
  </div>
</div>

{% endblock %}
