{% extends 'base.html' %}
{% block content %}

<<!-- add_member.html -->
<h3>Add Member to {{ room.name }}</h3>

<form method="POST">
    {% csrf_token %}
    <label for="user_select">Select a user to add:</label>
    <select name="user_id" id="user_select">
        {% for user in all_users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>
    <button type="submit">Add to Room</button>
</form>

<br>
<a href="{% url 'manage_members' room.id %}">Back to Manage Members</a>

{% endblock %}
