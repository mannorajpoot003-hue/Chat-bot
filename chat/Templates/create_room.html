{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Create New Chat Group</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Group Name</label>
                            <input type="text" name="room_name" class="form-control" placeholder="e.g. Vibe Tribe" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create & Join</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
