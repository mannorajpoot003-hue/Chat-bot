{% extends 'base.html' %}
{% block content %}
<div style="padding: 20px;">
    <h3>Edit Message</h3>
    <form method="POST">
        {% csrf_token %}
        <textarea name="content" rows="4" style="width: 100%;">{{ message.content }}</textarea>
        <br>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'chat' message.receiver.id %}">Cancel</a>
    </form>
</div>

{% endblock %}
